name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [Completion Acceptance]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue 3 Modern UI
        run: npx vite build --base=/Transcriptions/

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          rm -rf _site/courses
          cp -r courses _site/courses

      - name: Install release browser
        run: npx playwright install --with-deps chromium

      - name: Verify original reader URL in the exact site artifact
        run: bash scripts/test_reader_artifact.sh

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify published original reader URL
        env:
          READER_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          READER_SMOKE_PHASE: deployed
        run: npm run test:reader-smoke

      - name: Save reader release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-release-${{ github.event.workflow_run.head_sha }}
          path: test-results/
          if-no-files-found: warn
