name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [Completion Acceptance]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Skipped PR/failed/stale events use an isolated group and cannot cancel a release.
concurrency:
  group: pages-accepted-main-${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha && 'release' || github.run_id }}
  cancel-in-progress: true

jobs:
  # Finish upload in an earlier job: deploy-pages may miss a just-finalized
  # artifact in the same job (actions/deploy-pages#451).
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue 3 Modern UI
        run: npx vite build --base=/Transcriptions/

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          rm -rf _site/courses
          cp -r courses _site/courses

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install release browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install release browser OS dependencies
        run: npx playwright install-deps chromium

      - name: Verify original reader URL in the exact site artifact
        run: bash scripts/test_reader_artifact.sh

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'


  deploy:
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download validated Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact

      - name: Restore exact build for published asset comparison
        run: |
          mkdir -p dist
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C dist

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install release browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install release browser OS dependencies
        run: npx playwright install-deps chromium

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify published original reader URL
        env:
          READER_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          READER_SMOKE_PHASE: deployed
        run: npm run test:reader-smoke

      - name: Save reader release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-release-${{ github.event.workflow_run.head_sha }}
          path: test-results/
          if-no-files-found: warn
