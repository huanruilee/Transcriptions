name: Completion Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install acoustic verification tools
        run: |
          sources_dir="${APT_SOURCES_DIR:-/etc/apt}"
          # Hosted runners use mirror+file indirection; rewriting sources alone is insufficient.
          for sources_file in "${APT_SOURCES_FILE:-$sources_dir/sources.list}" "$sources_dir/apt-mirrors.txt" "$sources_dir"/sources.list.d/*.sources "$sources_dir"/sources.list.d/*.list; do
            if [ -f "$sources_file" ]; then
              sudo perl -pi -e 's{https?://azure\.archive\.ubuntu\.com/ubuntu}{https://archive.ubuntu.com/ubuntu}g' "$sources_file"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify transcript overview evidence and source digests
        run: npm run summaries:audit

      - name: Enforce strict quality flags on PR-modified sessions
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          changed=$(git -c core.quotePath=false diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'courses/*/sessions/session_*.json' 2>/dev/null || git -c core.quotePath=false diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}" HEAD -- 'courses/*/sessions/session_*.json')
          if [ -z "$changed" ]; then
            echo "No session JSON files added or modified in this PR."
            exit 0
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Checking $f with --strict --base-ref origin/${{ github.base_ref }}..."
            node scripts/check_session.mjs --file "$f" --strict --base-ref "origin/${{ github.base_ref }}"
          done <<< "$changed"

      - name: Verify committed human-review package semantics
        # Rebuilds the review queue in memory without local audio, ignores
        # local-only clip fields, and checks the committed HTML manifest.
        run: python3 scripts/build_human_review_package.py --check

      - name: Run completion gate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test

      - name: Run Vue/Vitest regression gate
        run: npm run test:v2

  reader-browser:
    name: Reader browser release contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx vite build --base=/Transcriptions/
      - name: Prepare the release artifact
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          rm -rf _site/courses
          cp -r courses _site/courses
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install release browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install release browser OS dependencies
        run: npx playwright install-deps chromium
      - name: Determine browser smoke scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          changed=$(git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null || git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}" HEAD)
          if echo "$changed" | grep -qE '^(src/|index\.html$|vite\.config\.ts$|playwright\.reader\.config\.ts$|tests/browser/|package(-lock)?\.json$|courses/入中論善顯密意疏/)'; then
            echo "UI or Ruzhong assets changed -> full 96-test browser suite."
          else
            echo "READER_SMOKE_SCOPE=core" >> "$GITHUB_ENV"
            echo "Non-UI/non-Ruzhong PR -> core browser smoke."
          fi
      - run: bash scripts/test_reader_artifact.sh
      - name: Save reader browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-browser-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
