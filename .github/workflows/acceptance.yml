name: Completion Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and acceptance tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Verify committed human-review package semantics
        # Rebuilds the review queue in memory without local audio, ignores
        # local-only clip fields, and checks the committed HTML manifest.
        run: python3 scripts/build_human_review_package.py --check

      - name: Run completion gate
        run: npm test
