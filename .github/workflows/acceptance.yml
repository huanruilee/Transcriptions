name: Completion Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and acceptance tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install acoustic verification tools
        run: |
          sources_file="${APT_SOURCES_FILE:-/etc/apt/sources.list.d/ubuntu.sources}"
          if [ -f "$sources_file" ]; then
            sudo perl -pi -e 's{https?://azure\.archive\.ubuntu\.com/ubuntu}{https://archive.ubuntu.com/ubuntu}g' "$sources_file"
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify transcript overview evidence and source digests
        run: npm run summaries:audit

      - name: Verify committed human-review package semantics
        # Rebuilds the review queue in memory without local audio, ignores
        # local-only clip fields, and checks the committed HTML manifest.
        run: python3 scripts/build_human_review_package.py --check

      - name: Run completion gate
        run: npm test

      - name: Run Vue/Vitest regression gate
        run: npm run test:v2
