name: Completion Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and acceptance tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build human-review package (manifest + HTML + clips)
        # Regenerates qa_27B/human_review_manifest.{json,md},
        # reviews/index.html, and the extracted WAV clips under
        # qa_27B/_human_review_clips/. Reads the committed audit
        # JSONs (no model load), so it's fast and deterministic.
        run: npm run build:human-review-package

      - name: Verify generated review artifacts are committed
        run: git diff --exit-code -- qa_27B/human_review_manifest.json qa_27B/human_review_manifest.md reviews/index.html reviews/README.md

      - name: Run completion gate
        run: npm test
