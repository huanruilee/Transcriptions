name: Completion Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and acceptance tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install acoustic verification tools
        run: |
          sources_dir="${APT_SOURCES_DIR:-/etc/apt}"
          # Hosted runners use mirror+file indirection; rewriting sources alone is insufficient.
          for sources_file in "${APT_SOURCES_FILE:-$sources_dir/sources.list}" "$sources_dir/apt-mirrors.txt" "$sources_dir"/sources.list.d/*.sources "$sources_dir"/sources.list.d/*.list; do
            if [ -f "$sources_file" ]; then
              sudo perl -pi -e 's{https?://azure\.archive\.ubuntu\.com/ubuntu}{https://archive.ubuntu.com/ubuntu}g' "$sources_file"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify transcript overview evidence and source digests
        run: npm run summaries:audit

      - name: Verify committed human-review package semantics
        # Rebuilds the review queue in memory without local audio, ignores
        # local-only clip fields, and checks the committed HTML manifest.
        run: python3 scripts/build_human_review_package.py --check

      - name: Run completion gate
        run: npm test

      - name: Run Vue/Vitest regression gate
        run: npm run test:v2

  reader-browser:
    name: Reader browser release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npx vite build --base=/Transcriptions/
      - name: Prepare the release artifact
        run: |
          mkdir -p _site
          cp -r dist/* _site/
          rm -rf _site/courses
          cp -r courses _site/courses
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/test_reader_artifact.sh
      - name: Save reader browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-browser-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
