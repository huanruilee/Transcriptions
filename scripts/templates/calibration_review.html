<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30／31 講音訊時間覆核</title>
<style>body{font:17px/1.65 system-ui;margin:auto;max-width:1100px;padding:20px;background:#f5f3ed;color:#242821}header{position:sticky;top:0;background:#f5f3ed;padding:8px 0;border-bottom:1px solid #aba;z-index:1}h1{font-size:24px}audio{width:100%}button,select,input{font:inherit;padding:7px;margin:4px;max-width:100%;box-sizing:border-box}button{cursor:pointer}article{background:white;border:1px solid #c9cfc5;border-radius:10px;margin:18px 0;padding:18px}pre{white-space:pre-wrap;font:inherit;font-size:14px}.status{font-size:14px;color:#5b6356}.text{font-size:19px}.error{color:#a32b22}label{display:inline-block}input[type=number]{width:130px}.toolbar{display:flex;flex-wrap:wrap;align-items:center}#clock{font-variant-numeric:tabular-nums}details{margin:10px 0}summary{cursor:pointer}a{color:#286446}</style>
<h1>第 30／31 講：音訊時間覆核</h1><p>本包為機器校準候選，<strong>尚未逐句人工聽核，正式網站僅部分校準</strong>。正文保留閱讀核定版；時間另行覆核。兩輪 ASR 出自同一模型，不是獨立投票。</p>
<header><div class="toolbar"><select id="session" aria-label="講次"></select><select id="filter" aria-label="篩選"><option value="pending">待回聽</option><option value="all">全部句子</option><option value="ready">機器邊界證據完整</option><option value="order">閱讀／錄音倒序</option></select><input id="search" placeholder="搜尋句 ID 或正文" aria-label="搜尋"><span id="counts"></span></div><audio id="audio" controls preload="metadata"></audio><div><span id="clock">尚未播放</span> <span id="playing"></span></div></header>
<p>「播放前後文」使用完整原音，按原音絕對秒數定位，播放到指定區段尾端自動暫停。這些區段是覆核視窗，不代表核定句界。填寫的起／訖秒數也使用原音絕對時間。</p>
<div class="toolbar"><input id="reviewer" placeholder="覆核者姓名（匯出時必填）" aria-label="覆核者"><button id="export">匯出本機覆核紀錄</button><span id="message" role="status"></span></div><p class="status">確認前必須勾選已回聽。本機選項僅保存在此瀏覽器，匯出後仍須核對版本與音源；不會自動更動網站、reading approval 或標為整講已聽核。</p>
<main id="cards"></main><script type="application/json" id="data">__REVIEW_DATA__</script><script>
const data=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s),key='calibration-review:'+data.version;
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=s=>{if(!Number.isFinite(s))return'未定位';return[String(Math.floor(s/3600)).padStart(2,'0'),String(Math.floor(s%3600/60)).padStart(2,'0'),(s%60).toFixed(2).padStart(5,'0')].join(':')};
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let endAt=null,playRequest=0;const audio=$('#audio');
for(const s of data.sessions){const o=document.createElement('option');o.value=s.id;o.textContent=s.id+' 講';$('#session').append(o)}
const current=()=>data.sessions.find(s=>s.id===$('#session').value);
function save(){localStorage.setItem(key,JSON.stringify(saved))}
function play(item){const session=current();const request=++playRequest;const seek=()=>{if(request!==playRequest)return;audio.currentTime=item.contextStart;endAt=item.contextEnd;audio.play().catch(e=>{$('#message').textContent=e.message})};if(audio.getAttribute('src')!==session.audioPath){audio.src=session.audioPath;audio.addEventListener('loadedmetadata',seek,{once:true});audio.load()}else seek();$('#playing').textContent=item.id+'：'+stamp(item.contextStart)+'–'+stamp(item.contextEnd)}
audio.addEventListener('timeupdate',()=>{$('#clock').textContent=stamp(audio.currentTime);if(endAt!==null&&audio.currentTime>=endAt){audio.pause();endAt=null}});
function render(){const session=current(),mode=$('#filter').value,q=$('#search').value.trim();$('#counts').textContent=`全部 ${session.summary.total}｜機器邊界 ${session.summary.ready}｜待回聽 ${session.summary.pending}`;const cards=$('#cards');cards.replaceChildren();
for(const item of session.items){if(mode==='pending'&&item.status!=='needs-listening'||mode==='ready'&&item.status!=='machine-evidence-ready'||mode==='order'&&!item.orderConflictWith||q&&!(`${item.id} ${item.readingText}`).includes(q))continue;
 const id=session.id+':'+item.id,record=saved[id]||{},p=item.proposal||{},card=document.createElement('article');card.dataset.id=item.id;
 card.innerHTML=`<strong>${h(item.id)}</strong> <span class="status">${h(item.status==='needs-listening'?'待回聽':'機器邊界證據完整，未人工聽核')}｜${h(item.category)}</span><p class="text">${h(item.readingText)}</p><p>原資料 ${stamp(item.oldStart)}–${stamp(item.oldEnd)}<br>候選 ${stamp(p.start)}–${stamp(p.end)}（${h(p.variant||'無可靠定位')}）${item.orderConflictWith?'<br><strong>錄音次序與 '+h(item.orderConflictWith)+' 的閱讀次序不同</strong>':''}</p><button class="play">播放前後文</button><details><summary>各輪原始辨識及檢查原因</summary>${item.alternatives.map(a=>`<p><strong>${h(a.variant)}</strong> ${stamp(a.start)}–${stamp(a.end)}<br>${h(a.evidence.acousticText)}<br><span class="status">${h(a.errors.join('、')||'每句邊界檢查通過；不是發布核定')}</span></p>`).join('')}<p class="error">${h(item.reasons.join('、'))}</p></details><div><label><input class="listened" type="checkbox" ${record.listened?'checked':''}>我已回聽此段</label><label>起 <input class="start" type="number" step="0.01" min="0" value="${h(record.start??p.start??'')}"></label><label>訖 <input class="end" type="number" step="0.01" min="0" value="${h(record.end??p.end??'')}"></label><select class="decision"><option value="unreviewed">尚未決定</option><option value="confirm">確認此時間</option><option value="uncertain">仍無法確認</option></select></div>`;
 card.querySelector('.decision').value=record.decision||'unreviewed';card.querySelector('.play').onclick=()=>play(item);
 for(const control of card.querySelectorAll('input,select'))control.onchange=()=>{const listened=card.querySelector('.listened').checked,decision=card.querySelector('.decision').value;const start=Number(card.querySelector('.start').value),end=Number(card.querySelector('.end').value);
 if(decision==='confirm'&&(!listened||!card.querySelector('.start').value||!card.querySelector('.end').value||!Number.isFinite(start)||!Number.isFinite(end)||start<0||end<=start||end>session.duration)){card.querySelector('.decision').value='uncertain';$('#message').textContent='確認時間前須先回聽，並填入有效起訖秒數。';}
 saved[id]={session:session.id,id:item.id,listened,decision:card.querySelector('.decision').value,start,end,recordedAt:new Date().toISOString(),sourceDigest:session.sourceDigest,audioSha256:session.audioSha256,ledgerDigest:session.ledgerDigest,readingPublicationDigest:session.readingPublicationDigest,readingContentDigest:session.readingContentDigest,clock:session.clock,videoOffsetSeconds:session.videoOffsetSeconds};save();};cards.append(card);
}}
$('#session').onchange=()=>{playRequest++;audio.pause();endAt=null;$('#playing').textContent='';render()};$('#filter').onchange=render;$('#search').oninput=render;
$('#export').onclick=()=>{const reviewer=$('#reviewer').value.trim();if(!reviewer){$('#message').textContent='請填入實際覆核者姓名。';return}const result={schema:'calibration-listening-decisions/v1',packageVersion:data.version,reviewer,exportedAt:new Date().toISOString(),automaticPublication:false,items:Object.values(saved).filter(r=>r.decision!=='unreviewed')};const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='calibration-listening-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('#message').textContent='已匯出；尚未套用網站。'};render();
</script></html>
